# Flat baseline sa 38 klasa — jednostavna CNN trenirana from scratch.
# Referentna tačka za "from scratch" pristup.

extends: _base.yaml

experiment:
  name: baseline_cnn_flat

task:
  type: flat                 # flat klasifikacija sa 38 klasa
  num_classes: 38

model:
  type: baseline_cnn
  dropout: 0.5

training:
  epochs: 40
  lr: 1.0e-3                 # viši LR za from-scratch treniranje
  optimizer: adamw
  scheduler: cosine

imbalance:
  use_weighted_sampler: false
  loss:
    type: weighted_ce
  class_weight_scheme: inverse
