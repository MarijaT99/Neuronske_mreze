# Flat ResNet-50 sa 38 klasa (ImageNet pretrained) - GLAVNA flat referenca.
# Fine-tuning poslednjih stage-ova + glave (head).

extends: _base.yaml

experiment:
  name: resnet50_flat

task:
  type: flat
  num_classes: 38

model:
  type: resnet50
  pretrained: true
  mode: finetune             # feature_extraction | finetune
  unfreeze_blocks: 2         # odmrzni poslednja 2 stage-a + glavu (head)
  drop_rate: 0.2

training:
  epochs: 25
  lr: 1.0e-4                 # niži LR za fine-tuning
  weight_decay: 1.0e-4
  optimizer: adamw
  scheduler: cosine

imbalance:
  use_weighted_sampler: false
  loss:
    type: weighted_ce
  class_weight_scheme: inverse
