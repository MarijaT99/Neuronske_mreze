# Zajedničke podrazumevane vrednosti. Config-ovi eksperimenata po potrebi prepisuju ključeve.
# Učitava se prvi, a zatim se duboko spaja sa config-om eksperimenta (videti utils/config).

seed: 42

data:
  # Putanje train skripte razrešavaju relativno u odnosu na koren repozitorijuma.
  # Na Kaggle-u, prepiši data_root putanjom na kojoj je montiran dataset.
  data_root: "data/raw/plantvillage dataset/color"
  splits_dir: "data/splits"
  img_size: 224
  batch_size: 32
  num_workers: 4
  aug_strength: heavy        # light | medium | heavy (jačina augmentation-a)

imbalance:
  # Kako se rešava neuravnoteženost klasa. Tačno jedna od ovih strategija je "primarna";
  # mogu se porediti kroz različite eksperimente.
  use_weighted_sampler: false
  loss:
    type: weighted_ce        # ce | weighted_ce | focal
    # za focal: gamma: 2.0, use_weights: true
  class_weight_scheme: inverse   # inverse | inverse_sqrt | effective

training:
  epochs: 30
  lr: 1.0e-3
  weight_decay: 1.0e-4
  optimizer: adamw           # adamw | adam | sgd
  scheduler: cosine          # cosine | plateau | none
  early_stopping_patience: 7
  grad_clip: 5.0
  amp: true
  monitor: macro_f1          # metrika za checkpoint / early stopping (veće je bolje)

experiment:
  name: _base
  out_dir: experiments        # podfolder po eksperimentu, kreiran na osnovu name
