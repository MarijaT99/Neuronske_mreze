# Hijerarhijski ResNet-50: jedna glava za vrstu (14 klasa) + glave za bolest po
# vrsti (samo 9 netrivijalnih vrsta dobija pravu glavu; 5 vrsta sa jednom klasom
# se preusmerava na disease id 0). Isti recept za backbone se koristi za svaku glavu.

extends: _base.yaml

experiment:
  name: resnet50_hierarchical

task:
  type: hierarchical

# Klasifikator vrste (L1).
species_model:
  type: resnet50
  pretrained: true
  mode: finetune
  unfreeze_blocks: 2
  drop_rate: 0.2

# Klasifikator bolesti po vrsti (L2) — ista arhitektura, num_classes se postavlja
# po vrsti tokom treniranja iz label_maps.
disease_model:
  type: resnet50
  pretrained: true
  mode: finetune
  unfreeze_blocks: 2
  drop_rate: 0.2

training:
  epochs: 25
  lr: 1.0e-4
  optimizer: adamw
  scheduler: cosine

imbalance:
  use_weighted_sampler: false
  loss:
    type: weighted_ce
  class_weight_scheme: inverse
